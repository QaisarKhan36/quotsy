name: Build Android app

# Run from GitHub: Actions tab -> "Build Android app" -> Run workflow.
# Needs one repository secret: EXPO_TOKEN (expo.dev -> Account settings -> Access tokens).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build type: production (.aab for Play Store) or preview (.apk to install on your phone)"
        required: true
        default: production
        type: choice
        options: [production, preview]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check EXPO_TOKEN secret
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::Add a repository secret named EXPO_TOKEN (Settings -> Secrets and variables -> Actions). See README."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Link Expo project (first run creates it)
        run: eas init --non-interactive --force

      - name: Start cloud build
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait

      - name: Where to download
        run: echo "Build started. Download it from https://expo.dev -> your project -> Builds (takes ~10-20 min)."
